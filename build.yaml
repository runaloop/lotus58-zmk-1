# This file generates the GitHub Actions matrix.
#
# Board naming follows Zephyr 4.1 / hardware model v2 (ZMK, Dec 2025):
#   nice_nano_v2  ->  nice_nano//zmk
#
# ZMK Studio is enabled on the central (left) half only.
---
include:
  - board: nice_nano//zmk
    shield: lotus58_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: lotus58_right
  - board: nice_nano//zmk
    shield: settings_reset
